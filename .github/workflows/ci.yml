name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --frozen
      - run: uv run ruff check src evals bench tests
      - run: uv run pytest -q

  redteam-eval:
    # Offline + deterministic: no API key, no cost, same result on every run. This is the gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --frozen
      - name: Run red-team + false-positive suite
        run: uv run python evals/run_eval.py --out reports/eval.json
      - name: Compare against baseline
        id: gate
        run: |
          set +e
          uv run python evals/compare.py reports/eval.json evals/baseline.json --md reports/pr_comment.md
          echo "exit=$?" >> "$GITHUB_OUTPUT"
      - name: Publish evaluation summary
        run: cat reports/pr_comment.md >> "$GITHUB_STEP_SUMMARY"
      # Fork PRs and Dependabot receive read-only tokens. Their report remains
      # available in the job summary and uploaded artifact.
      - name: Post results on the PR
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: guardrail-eval
          path: reports/pr_comment.md
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: reports/
      - name: Fail on regression
        if: steps.gate.outputs.exit != '0'
        run: |
          echo "::error::Guardrail eval regressed against evals/baseline.json (see job summary or eval-report artifact)"
          exit 1

  llm-eval:
    # Opt-in: add the `llm-eval` label to a PR. Runs the Haiku-judged checks with a warm response cache.
    # Repository secrets are unavailable to fork PRs and Dependabot.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'llm-eval')
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --frozen
      - uses: actions/cache@v4
        with:
          path: .cache/llm
          key: llm-cache-${{ hashFiles('evals/data/**', 'src/guardrail/checks/**') }}
          restore-keys: llm-cache-
      - run: uv run python evals/run_eval.py --llm --policy policies/llm-assisted.yaml --out reports/eval_llm.json
      - run: uv run python evals/compare.py reports/eval_llm.json evals/baseline_llm.json --md reports/pr_comment_llm.md || true
        if: hashFiles('evals/baseline_llm.json') != ''
      - uses: marocchino/sticky-pull-request-comment@v2
        if: hashFiles('reports/pr_comment_llm.md') != ''
        continue-on-error: true
        with:
          header: guardrail-eval-llm
          path: reports/pr_comment_llm.md
